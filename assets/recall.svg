<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Recall by model: Random Forest default 43.7%, Logistic Regression 60.1%, Random Forest balanced 65.4%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .name{font-size:17px;font-weight:600;fill:#e2e8f0}
    .val{font-size:18px;font-weight:800;fill:#f8fafc;animation:fade 8s ease-out infinite}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow 8s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes grow{0%{transform:scaleX(0)}14%,100%{transform:scaleX(1)}}
    @keyframes fade{0%,10%{opacity:0}20%,100%{opacity:1}}
  </style>
  <rect width="1200" height="250" rx="22" fill="#080d1c"/>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="40" y="40" font-size="15" fill="#94a3b8" letter-spacing="1.5">RECALL · HOW MANY REAL CHURNERS DOES EACH MODEL CATCH?</text>

  <g stroke="#ffffff" stroke-opacity="0.08">
    <path d="M400 62V200"/><path d="M750 62V200"/><path d="M1100 62V200"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="400" y="222">0%</text><text x="750" y="222">50%</text><text x="1100" y="222">100%</text>
  </g>

  <text class="name" x="40" y="93">Random Forest (default)</text>
  <rect x="400" y="74" width="700" height="26" rx="13" fill="#111a33"/>
  <rect class="bar" x="400" y="74" width="306" height="26" rx="13" fill="#64748b" style="animation-delay:.1s"/>
  <text class="val" x="722" y="93" style="animation-delay:.1s">43.7%</text>

  <text class="name" x="40" y="143">Logistic Regression</text>
  <rect x="400" y="124" width="700" height="26" rx="13" fill="#111a33"/>
  <rect class="bar" x="400" y="124" width="421" height="26" rx="13" fill="#7c8aa5" style="animation-delay:.3s"/>
  <text class="val" x="837" y="143" style="animation-delay:.3s">60.1%</text>

  <text class="name" x="40" y="193">⭐ Random Forest (balanced)</text>
  <rect x="400" y="174" width="700" height="26" rx="13" fill="#111a33"/>
  <rect class="bar" x="400" y="174" width="458" height="26" rx="13" fill="url(#win)" style="animation-delay:.5s"/>
  <text class="val" x="874" y="193" style="animation-delay:.5s">65.4%</text>
</svg>
