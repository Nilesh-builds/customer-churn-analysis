<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Six-stage workflow: cleaning, exploration, segmentation, modeling, strategy, dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .lab{font-size:17px;font-weight:700;fill:#f1f5f9}
    .sub{font-size:12px;fill:#94a3b8}
    .step{font-size:11px;fill:#22d3ee;letter-spacing:2px;font-weight:600}
    .prog{stroke-dasharray:1000;animation:prog 7.2s linear infinite}
    @keyframes prog{0%{stroke-dashoffset:1000;opacity:1}83.3%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1000;opacity:0}}
    .dot{animation:travel 7.2s linear infinite}
    @keyframes travel{0%{transform:translateX(0);opacity:1}83.3%{transform:translateX(1000px);opacity:1}92%{transform:translateX(1000px);opacity:0}100%{transform:translateX(0);opacity:0}}
    .halo{transform-box:fill-box;transform-origin:center;opacity:0;animation:flash 7.2s ease-out infinite}
    @keyframes flash{0%{opacity:0;transform:scale(.8)}3%{opacity:1}16%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
  </style>
  <rect width="1200" height="210" rx="22" fill="#080d1c"/>
  <rect x="0.5" y="0.5" width="1199" height="209" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <path d="M100 80H1100" stroke="#334155" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/>
  <path class="prog" d="M100 80H1100" pathLength="1000" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle class="dot" cx="100" cy="80" r="7" fill="#ffffff" filter="url(#glow)"/>

  <g>
    <circle class="halo" cx="100" cy="80" r="44" fill="none" stroke="#22d3ee" stroke-width="3" style="animation-delay:0s"/>
    <circle cx="100" cy="80" r="34" fill="#0d1326" stroke="url(#pg)" stroke-width="2.5"/>
    <text x="100" y="91" font-size="30" text-anchor="middle">🧹</text>
    <text class="step" x="100" y="140" text-anchor="middle">STEP 1</text>
    <text class="lab" x="100" y="160" text-anchor="middle">Cleaning</text>
    <text class="sub" x="100" y="180" text-anchor="middle">Fix TotalCharges</text>
  </g>
  <g>
    <circle class="halo" cx="300" cy="80" r="44" fill="none" stroke="#22d3ee" stroke-width="3" style="animation-delay:1.2s"/>
    <circle cx="300" cy="80" r="34" fill="#0d1326" stroke="url(#pg)" stroke-width="2.5"/>
    <text x="300" y="91" font-size="30" text-anchor="middle">🔍</text>
    <text class="step" x="300" y="140" text-anchor="middle">STEP 2</text>
    <text class="lab" x="300" y="160" text-anchor="middle">Exploration</text>
    <text class="sub" x="300" y="180" text-anchor="middle">Find the drivers</text>
  </g>
  <g>
    <circle class="halo" cx="500" cy="80" r="44" fill="none" stroke="#22d3ee" stroke-width="3" style="animation-delay:2.4s"/>
    <circle cx="500" cy="80" r="34" fill="#0d1326" stroke="url(#pg)" stroke-width="2.5"/>
    <text x="500" y="91" font-size="30" text-anchor="middle">🎯</text>
    <text class="step" x="500" y="140" text-anchor="middle">STEP 3</text>
    <text class="lab" x="500" y="160" text-anchor="middle">Segmentation</text>
    <text class="sub" x="500" y="180" text-anchor="middle">High · Medium · Low risk</text>
  </g>
  <g>
    <circle class="halo" cx="700" cy="80" r="44" fill="none" stroke="#22d3ee" stroke-width="3" style="animation-delay:3.6s"/>
    <circle cx="700" cy="80" r="34" fill="#0d1326" stroke="url(#pg)" stroke-width="2.5"/>
    <text x="700" y="91" font-size="30" text-anchor="middle">🤖</text>
    <text class="step" x="700" y="140" text-anchor="middle">STEP 4</text>
    <text class="lab" x="700" y="160" text-anchor="middle">Modeling</text>
    <text class="sub" x="700" y="180" text-anchor="middle">Class-weighted Random Forest</text>
  </g>
  <g>
    <circle class="halo" cx="900" cy="80" r="44" fill="none" stroke="#22d3ee" stroke-width="3" style="animation-delay:4.8s"/>
    <circle cx="900" cy="80" r="34" fill="#0d1326" stroke="url(#pg)" stroke-width="2.5"/>
    <text x="900" y="91" font-size="30" text-anchor="middle">💡</text>
    <text class="step" x="900" y="140" text-anchor="middle">STEP 5</text>
    <text class="lab" x="900" y="160" text-anchor="middle">Strategy</text>
    <text class="sub" x="900" y="180" text-anchor="middle">5 recommendations</text>
  </g>
  <g>
    <circle class="halo" cx="1100" cy="80" r="44" fill="none" stroke="#22d3ee" stroke-width="3" style="animation-delay:6s"/>
    <circle cx="1100" cy="80" r="34" fill="#0d1326" stroke="url(#pg)" stroke-width="2.5"/>
    <text x="1100" y="91" font-size="30" text-anchor="middle">📊</text>
    <text class="step" x="1100" y="140" text-anchor="middle">STEP 6</text>
    <text class="lab" x="1100" y="160" text-anchor="middle">Dashboard</text>
    <text class="sub" x="1100" y="180" text-anchor="middle">Power BI</text>
  </g>
</svg>
