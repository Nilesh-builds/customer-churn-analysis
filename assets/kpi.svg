<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Key results: 15x churn gap, 0 to 3 danger months, 65.4% recall, 244 of 373 churners caught" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tx2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .card{animation:up .9s cubic-bezier(.2,.8,.2,1) backwards}
    @keyframes up{from{opacity:0;transform:translateY(26px)}}
    .run{animation:run 6s linear infinite}
    @keyframes run{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
    .num{font-size:54px;font-weight:800}
    .lab{font-size:18px;font-weight:700;fill:#f1f5f9}
    .sub{font-size:13px;fill:#94a3b8}
  </style>

  <g transform="translate(0,10)">
    <g class="card" style="animation-delay:.05s">
      <rect width="282" height="170" rx="20" fill="#0d1326" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect class="run" width="282" height="170" rx="20" fill="none" stroke="url(#lg)" stroke-width="2.5" pathLength="1000" stroke-dasharray="140 860" style="animation-delay:0s"/>
      <text x="24" y="38" font-size="20">🔑</text>
      <text class="num" x="141" y="94" text-anchor="middle" fill="url(#tx)">15×</text>
      <text class="lab" x="141" y="124" text-anchor="middle">Churn gap</text>
      <text class="sub" x="141" y="148" text-anchor="middle">month-to-month vs two-year</text>
    </g>
  </g>

  <g transform="translate(306,10)">
    <g class="card" style="animation-delay:.2s">
      <rect width="282" height="170" rx="20" fill="#0d1326" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect class="run" width="282" height="170" rx="20" fill="none" stroke="url(#lg)" stroke-width="2.5" pathLength="1000" stroke-dasharray="140 860" style="animation-delay:-1.5s"/>
      <text x="24" y="38" font-size="20">⏳</text>
      <text class="num" x="141" y="94" text-anchor="middle" fill="url(#tx2)">0–3</text>
      <text class="lab" x="141" y="124" text-anchor="middle">Danger months</text>
      <text class="sub" x="141" y="148" text-anchor="middle">where attrition concentrates</text>
    </g>
  </g>

  <g transform="translate(612,10)">
    <g class="card" style="animation-delay:.35s">
      <rect width="282" height="170" rx="20" fill="#0d1326" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect class="run" width="282" height="170" rx="20" fill="none" stroke="url(#lg)" stroke-width="2.5" pathLength="1000" stroke-dasharray="140 860" style="animation-delay:-3s"/>
      <text x="24" y="38" font-size="20">🎯</text>
      <text class="num" x="141" y="94" text-anchor="middle" fill="url(#tx)">65.4%</text>
      <text class="lab" x="141" y="124" text-anchor="middle">Recall</text>
      <text class="sub" x="141" y="148" text-anchor="middle">2 in 3 real churners flagged</text>
    </g>
  </g>

  <g transform="translate(918,10)">
    <g class="card" style="animation-delay:.5s">
      <rect width="282" height="170" rx="20" fill="#0d1326" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect class="run" width="282" height="170" rx="20" fill="none" stroke="url(#lg)" stroke-width="2.5" pathLength="1000" stroke-dasharray="140 860" style="animation-delay:-4.5s"/>
      <text x="24" y="38" font-size="20">🚨</text>
      <text class="num" x="158" y="94" text-anchor="end" fill="url(#tx2)">244</text>
      <text x="162" y="94" font-size="26" font-weight="700" fill="#94a3b8">/373</text>
      <text class="lab" x="141" y="124" text-anchor="middle">Churners caught</text>
      <text class="sub" x="141" y="148" text-anchor="middle">in the held-out test set</text>
    </g>
  </g>
</svg>
