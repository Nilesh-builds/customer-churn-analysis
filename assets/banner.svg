<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Customer Churn Analysis banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a18"/><stop offset="0.55" stop-color="#150f38"/><stop offset="1" stop-color="#05283a"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .orb{animation:float 10s ease-in-out infinite alternate}
    .orb.b{animation-duration:14s;animation-direction:alternate-reverse}
    @keyframes float{from{transform:translate(0,0)}to{transform:translate(70px,34px)}}
    .curve{stroke-dasharray:100;animation:draw 6s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
    .areafill{animation:fadein 6s ease-in-out infinite}
    @keyframes fadein{0%,20%{opacity:0}55%,100%{opacity:1}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.4);opacity:0}}
    .p{animation:rise 9s linear infinite}
    @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-300px);opacity:0}}
    .in{animation:in 1.1s cubic-bezier(.2,.8,.2,1) backwards}
    @keyframes in{from{opacity:0;transform:translateY(16px)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb" cx="180" cy="40" r="230" fill="url(#o1)"/>
    <circle class="orb b" cx="980" cy="290" r="270" fill="url(#o2)"/>

    <g fill="#ffffff">
      <circle class="p" cx="90"  cy="315" r="2"   style="animation-delay:-1s"/>
      <circle class="p" cx="260" cy="315" r="3"   style="animation-delay:-4s"/>
      <circle class="p" cx="430" cy="315" r="2"   style="animation-delay:-7s"/>
      <circle class="p" cx="610" cy="315" r="2.5" style="animation-delay:-2.5s"/>
      <circle class="p" cx="700" cy="315" r="2"   style="animation-delay:-5.5s"/>
      <circle class="p" cx="880" cy="315" r="3"   style="animation-delay:-8s"/>
      <circle class="p" cx="1030" cy="315" r="2"  style="animation-delay:-3s"/>
      <circle class="p" cx="1140" cy="315" r="2.5" style="animation-delay:-6s"/>
    </g>

    <!-- retention curve -->
    <text x="770" y="62" font-size="12" fill="#94a3b8" letter-spacing="1.5">CUSTOMERS RETAINED</text>
    <path d="M760 75V262H1150" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <path class="areafill" d="M760 95C830 100 850 175 930 205S1050 240 1140 246V262H760Z" fill="url(#area)"/>
    <path class="curve" pathLength="100" d="M760 95C830 100 850 175 930 205S1050 240 1140 246" fill="none" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="760" cy="95" r="5" fill="#22d3ee"/>
    <circle cx="930" cy="205" r="5" fill="#a78bfa"/>
    <circle class="pulse" cx="1140" cy="246" r="6" fill="#f472b6"/>
    <circle cx="1140" cy="246" r="6" fill="#f472b6"/>
    <text x="1150" y="284" text-anchor="end" font-size="12" fill="#94a3b8" letter-spacing="1.5">TENURE →</text>

    <!-- copy -->
    <g class="in">
      <rect x="60" y="48" width="262" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="80" y="68" font-size="12" font-weight="600" fill="#67e8f9" letter-spacing="2">END-TO-END ANALYTICS · ML</text>
    </g>
    <g class="in" style="animation-delay:.15s">
      <text x="60" y="140" font-size="58" font-weight="800" fill="url(#tx)">CUSTOMER CHURN</text>
      <text x="60" y="203" font-size="58" font-weight="800" fill="url(#tx)">ANALYSIS</text>
    </g>
    <text class="in" style="animation-delay:.35s" x="60" y="248" font-size="20" fill="#cbd5e1">Predict who leaves. Understand why. Act before they go.</text>
    <text class="in" style="animation-delay:.5s" x="60" y="282" font-size="14" fill="#94a3b8">Telco dataset  ·  7,043 customers  ·  Random Forest  ·  Streamlit  ·  Power BI</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
